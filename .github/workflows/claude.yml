# Write @claude in an issue or a pull request comment and Claude opens a PR
# against this repo, working to the contract in AGENTS.md.
#
# Inert until two one-time steps are done:
#   1. Install the Claude GitHub App on this repository
#      (run `/install-github-app` inside Claude Code, or install it from
#       https://github.com/apps/claude).
#   2. Add an ANTHROPIC_API_KEY repository secret.
#
# Until then nothing happens — this workflow only fires on an explicit
# @claude mention, never on push, so it cannot turn the build red.
#
# Only users with write access can trigger it: the `author_association`
# guard below means a drive-by comment from a stranger cannot spend your
# tokens or open a branch.

name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (
        github.event_name == 'issues' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      ) || (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@374f254f5efaf968abfe15d399fd90972e8138b9 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Follow AGENTS.md in the repository root. It is the full contract.
            `python3 tools/check_skills.py` must print OK before you open a PR.
