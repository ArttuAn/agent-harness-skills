name: check

on:
  push:
    branches: [main]
  pull_request:

# Contributions arrive from forks. This workflow holds no secrets and needs
# no write access, so an untrusted PR can run the validator and nothing else.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate skills
        run: python3 tools/check_skills.py

      - name: Installer security regressions
        run: python3 -m unittest discover -s tests -v

      - name: Verify Claude trigger authorization
        run: node --test tests/claude-trigger.test.cjs

      - name: Shellcheck the installer
        run: bash -n install.sh

      - name: Install into a scratch directory
        run: |
          ./install.sh \
            --opencode-dir "$RUNNER_TEMP/oc" \
            --claude-skills-dir "$RUNNER_TEMP/cs" \
            --claude-dir "$RUNNER_TEMP/cc"
          test -f "$RUNNER_TEMP/cs/react/SKILL.md"
          test -f "$RUNNER_TEMP/cs/react/references/failure-modes.md"
          test -f "$RUNNER_TEMP/cc/react.md"
